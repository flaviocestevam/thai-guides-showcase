name: Audit Venda × Guia

on:
  push:
    paths:
      - "src/data/sales/ilhas.ts"
      - "src/pages/Koh*.tsx"
      - "scripts/audit-sales-vs-guide.mjs"
      - ".github/workflows/audit-sales-vs-guide.yml"
  pull_request:
    paths:
      - "src/data/sales/ilhas.ts"
      - "src/pages/Koh*.tsx"
      - "scripts/audit-sales-vs-guide.mjs"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run audit (strict)
        run: node scripts/audit-sales-vs-guide.mjs --strict
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sales-vs-guide
          path: .lovable/audit-sales-vs-guide.txt
